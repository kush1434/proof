name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      # Submodule unit tests. The template Makefile only knows how to build the
      # top level, so these go through test/run.py. That runner exits non-zero
      # on failure via its own results-XML check -- see TB-3 in BUGS.md, where
      # it did not, and this step could not have gone red.
      - name: Run submodule unit tests
        run: |
          cd test
          python run.py --unit mac_serial

      # Inference latency. Kept out of COCOTB_TEST_MODULES so the main suite
      # stays at 43 tests and its runtime does not grow, but it has to run
      # somewhere: RESULTS.md quotes 896 cycles and derives the 32.0 nJ energy
      # figure from it, and the previous latency number survived for months in
      # a document because the test that produced it was never committed.
      # test_cycles asserts the figure, so this step is what makes that true.
      - name: Inference latency
        run: |
          cd test
          python run.py --module test_cycles

      # Mutation testing. A green suite proves nothing until it can go red, and
      # a harness left out of CI rots. This also re-runs the two self-tests --
      # the CRLF-safe did-not-apply guard, and the check that run.py can report
      # failure at all (BUGS.md TB-3) -- and aborts if either is broken.
      - name: Mutation testing
        shell: bash
        run: ./mutate.sh

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results*.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results*.xml
            test/output/*

  # The monotonicity argument in RESULTS.md 3 is a hand proof about an
  # idealised pipeline. R-4 is this project's own evidence that such an
  # argument can be right about the datapath and still miss what the hardware
  # does at its edges. This machine-checks its load-bearing lemma -- that the
  # saturating accumulator is monotone -- against src/accumulator.v itself,
  # by k-induction, so the result is unbounded rather than "no counterexample
  # in the first N cycles".
  #
  # Three tasks, not one: the proof closes in about a second, which is also
  # what a vacuous proof looks like. A wrapping mutant must FAIL and the real
  # design at the same widths must PASS, or the proof is proving nothing.
  # formal/run.py exits non-zero if any task misses its expectation.
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install oss-cad-suite (yosys, sby, yices)
        uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prove the accumulator monotone, and check the proof can fail
        run: |
          cd formal
          python run.py

      - name: Upload counterexample traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-traces
          path: formal/*/engine_0/*.vcd

