# Gates for the BIBM submission.
#
# There is no LaTeX on the development machine, so the paper cannot be compiled
# there and every error it would have caught -- an unescaped underscore, a
# broken \ref, a figure that no longer builds -- survives until it reaches
# Overleaf. These checks stand in for that compile, and they run on every push
# so nobody has to remember them.
#
# The number check is the important one. Five figures in this project have gone
# stale by being superseded in one document and left behind in another, and
# every one was caught late, by a human re-reading. This fails the build
# instead.
#
# Deliberately does NOT re-run the model analyses: those need the CGMacros data,
# which is not in the repository (CC BY-NC-SA against an Apache-2.0 repo), and
# take tens of minutes. Regenerating a canonical value stays a local job -- see
# paper/NUMBERS-CHECK.md.

name: paper

on:
  push:
    paths:
      - "paper/**"
      - "*.md"
      - "check_numbers.py"
      - ".github/workflows/paper.yaml"
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checkers themselves are standard library only, on purpose -- a gate
      # that needs a dependency tree is a gate that rots. matplotlib and Pillow
      # are only for the figure-rebuild step below.
      - name: Install figure dependencies
        run: python -m pip install --quiet matplotlib numpy pillow

      - name: Numbers agree across every document
        run: python check_numbers.py

      - name: Paper structure, references and length
        run: python paper/check_tex.py

      - name: Compile blockers LaTeX would catch
        run: python paper/check_specials.py

      # Not a byte-comparison: matplotlib stamps a creation date into the PDF,
      # so regenerated output never matches bit for bit. This checks the weaker
      # but still useful thing -- that every figure script still runs against
      # the committed data, so a script cannot silently rot away from the
      # figure it supposedly produces.
      - name: Every figure still builds from its script
        run: |
          for f in paper/figures/fig*.py; do
            echo "--- $f"
            python "$f"
          done

      # The checkers above only approximate a compile. This is the compile.
      # texlive-publishers carries IEEEtran.cls; the rest are what the preamble
      # asks for.
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-publishers poppler-utils

      # Twice, so \ref and \cite resolve. -halt-on-error so a real failure is a
      # failure rather than an interactive prompt that hangs the runner.
      - name: Compile the paper
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error proof_bibm2026.tex
          pdflatex -interaction=nonstopmode -halt-on-error proof_bibm2026.tex

      # The page limit is a hard rule of the call for papers, and the estimate
      # in check_tex.py is only an estimate. This is the real number.
      - name: Enforce the 5-page limit
        working-directory: paper
        run: |
          pages=$(pdfinfo proof_bibm2026.pdf | awk '/^Pages:/ {print $2}')
          echo "compiled to $pages page(s)"
          if [ "$pages" -gt 5 ]; then
            echo "::error::$pages pages, limit is 5 including references"
            exit 1
          fi

      # Undefined references and overfull boxes do not fail the compile, but
      # both are visible defects in a submitted PDF.
      - name: Report undefined references and overfull boxes
        working-directory: paper
        run: |
          if grep -qE "Warning: (Citation|Reference).*undefined" proof_bibm2026.log; then
            grep -E "Warning: (Citation|Reference).*undefined" proof_bibm2026.log
            echo "::error::undefined references"
            exit 1
          fi
          echo "no undefined references"
          grep -c "Overfull \\\\hbox" proof_bibm2026.log || echo "0 overfull hboxes"
          grep -A1 "Overfull \\\\hbox" proof_bibm2026.log | head -40 || true

      - name: Upload the compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/proof_bibm2026.pdf
